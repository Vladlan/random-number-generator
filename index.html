<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number Generator Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --purple: #7c3aed;
      --success: #10b981;
      --soft: #f8fafc;
      --line: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: min(1200px, 100%);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      color: white;
      font-size: clamp(1.8rem, 2.5vw, 3rem);
    }

    .nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: white;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid #e2e8f0;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .mode-btn {
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: white;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .pick-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 340px;
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      border-radius: 18px;
      padding: 24px;
    }

    .label {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .selected-number {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 900;
      color: var(--primary);
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 18px;
      transition: transform 0.2s ease;
    }

    .selected-number.pulse { transform: scale(1.12); }

    .number-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .chip.empty {
      background: #f1f5f9;
      color: var(--muted);
      min-width: 150px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary);
    }

    .stat-name {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .chart-box {
      height: 260px;
      margin-top: 16px;
    }

    .history-list {
      max-height: 320px;
      overflow-y: auto;
      margin-top: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      padding: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 0.96rem;
    }

    .history-item:last-child { border-bottom: none; }

    .history-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 10px;
      min-width: 32px;
      height: 32px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
    }

    .history-time {
      color: var(--muted);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .empty-state {
      padding: 26px 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Random Number Generator</h1>
      <div class="nav">
        <button class="btn btn-secondary" id="goRandom">Random Mode</button>
        <button class="btn btn-secondary" id="goSelect">Selection Mode</button>
      </div>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="random">Random Generator</button>
      <button class="mode-btn" data-mode="select">Remaining Selection</button>
    </div>

    <div id="randomSection">
      <div class="grid">
        <div class="panel" style="background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white;">
          <div class="pick-box" style="background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.15);">
            <div class="label" style="color: rgba(255,255,255,0.8);">Generate</div>
            <div class="selected-number" id="randomNumber" style="color: white;">-</div>
            <button class="btn btn-primary" id="generateBtn">Generate</button>
          </div>
        </div>

        <div class="panel">
          <h2>Statistics</h2>
          <div class="stats">
            <div class="stat-box">
              <div class="stat-value" id="count1">0</div>
              <div class="stat-label stat-name">1</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="count2">0</div>
              <div class="stat-label stat-name">2</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="count3">0</div>
              <div class="stat-label stat-name">3</div>
            </div>
          </div>
          <div class="chart-box">
            <canvas id="statsChart"></canvas>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top: 24px;">
        <div class="label">Generation Log</div>
        <div class="history-list" id="logList">
          <div class="empty-state">No generations yet. Click the button to start!</div>
        </div>
        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 16px;">
          <button class="btn btn-secondary" onclick="exportData()">Export Data</button>
          <button class="btn btn-secondary" onclick="clearRandomData()">Clear All</button>
        </div>
      </div>
    </div>

    <div id="selectorSection" style="display:none;">
      <div class="grid">
        <div class="panel">
          <div class="pick-box">
            <div class="label">Selected</div>
            <div class="selected-number" id="selectedNumber">—</div>

            <button class="btn btn-primary" id="pickBtn">Select a Number</button>

            <div class="remaining-wrap" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; width: 100%;">
              <div class="label" style="margin: 18px 0 0; width: 100%;">Remaining</div>
              <div id="remainingNumbers" class="number-box"></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="stats">
            <div class="stat-box">
              <div class="stat-value" id="totalSelections">0</div>
              <div class="stat-name">Selections</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="currentRound">0</div>
              <div class="stat-name">This Round</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="leftCount">3</div>
              <div class="stat-name">Left</div>
            </div>
          </div>

          <div class="chart-box">
            <canvas id="selectorChart"></canvas>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top: 24px;">
        <div class="label">History</div>
        <div class="history-list" id="selectorHistoryList"></div>
        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 16px;">
          <button class="btn btn-secondary" id="resetRoundBtn">Reset Current Round</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== RANDOM MODE =====
    const RANDOM_DB = 'NumberGeneratorDB';
    const RANDOM_STORE = 'generations';
    let randomDb;
    let randomChart;

    function initRandomDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(RANDOM_DB, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(RANDOM_STORE)) {
            db.createObjectStore(RANDOM_STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          randomDb = request.result;
          resolve();
        };
        request.onerror = () => reject(request.error);
      });
    }

    function addRandomGeneration(number) {
      return new Promise((resolve, reject) => {
        const tx = randomDb.transaction([RANDOM_STORE], 'readwrite');
        const store = tx.objectStore(RANDOM_STORE);
        const record = { number, timestamp: new Date().toISOString() };
        const req = store.add(record);
        req.onsuccess = () => resolve(record);
        req.onerror = () => reject(req.error);
      });
    }

    function getAllRandomGenerations() {
      return new Promise((resolve, reject) => {
        const tx = randomDb.transaction([RANDOM_STORE], 'readonly');
        const store = tx.objectStore(RANDOM_STORE);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function clearRandomData() {
      return new Promise((resolve, reject) => {
        const tx = randomDb.transaction([RANDOM_STORE], 'readwrite');
        const store = tx.objectStore(RANDOM_STORE);
        const req = store.clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function buildRandomStats(generations) {
      const counts = { 1: 0, 2: 0, 3: 0 };
      generations.forEach(g => counts[g.number]++);
      return counts;
    }

    function renderRandomHistory(generations) {
      const list = document.getElementById('logList');
      if (!generations.length) {
        list.innerHTML = '<div class="empty-state">No generations yet. Click the button to start!</div>';
        return;
      }
      list.innerHTML = generations.slice().reverse().map(g => {
        const t = new Date(g.timestamp);
        return `
          <div class="history-item">
            <span>${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            <span class="badge" style="min-width: 42px;">${g.number}</span>
            <span>${t.toLocaleDateString()}</span>
          </div>
        `;
      }).join('');
    }

    function renderRandomStats(generations) {
      const counts = buildRandomStats(generations);
      document.getElementById('count1').textContent = counts[1];
      document.getElementById('count2').textContent = counts[2];
      document.getElementById('count3').textContent = counts[3];

      const ctx = document.getElementById('statsChart').getContext('2d');
      const data = [counts[1], counts[2], counts[3]];
      if (randomChart) {
        randomChart.data.datasets[0].data = data;
        randomChart.update();
      } else {
        randomChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['1', '2', '3'],
            datasets: [{
              data,
              backgroundColor: ['#4f46e5', '#8b5cf6', '#ec4899'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
          }
        });
      }
    }

    async function updateRandomUI() {
      const generations = await getAllRandomGenerations();
      renderRandomHistory(generations);
      renderRandomStats(generations);
    }

    async function generateNumber() {
      const number = Math.floor(Math.random() * 3) + 1;
      const display = document.getElementById('randomNumber');
      display.textContent = number;
      display.classList.remove('pulse');
      void display.offsetWidth;
      display.classList.add('pulse');
      await addRandomGeneration(number);
      await updateRandomUI();
    }

    async function exportData() {
      const generations = await getAllRandomGenerations();
      const blob = new Blob([JSON.stringify(generations, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'random-number-history.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===== SELECTOR MODE =====
    const SELECTOR_DB = 'RemainingNumberSelectorDB';
    const SELECTION_STORE = 'selections';
    const ROUND_STORE = 'currentRound';
    let selectorDb;
    let selectorChart;
    let remaining = [1, 2, 3];
    let currentSelected = null;

    function initSelectorDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(SELECTOR_DB, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(SELECTION_STORE)) {
            db.createObjectStore(SELECTION_STORE, { keyPath: 'id', autoIncrement: true });
          }
          if (!db.objectStoreNames.contains(ROUND_STORE)) {
            db.createObjectStore(ROUND_STORE, { keyPath: 'key' });
          }
        };
        request.onsuccess = () => {
          selectorDb = request.result;
          resolve();
        };
        request.onerror = () => reject(request.error);
      });
    }

    function saveSelection(selected, remainingAfter) {
      return new Promise((resolve, reject) => {
        const tx = selectorDb.transaction(SELECTION_STORE, 'readwrite');
        const store = tx.objectStore(SELECTION_STORE);
        const record = { selected, remainingAfter: remainingAfter.slice(), timestamp: new Date().toISOString() };
        const request = store.add(record);
        request.onsuccess = () => resolve(record);
        request.onerror = () => reject(request.error);
      });
    }

    function saveRoundState() {
      return new Promise((resolve, reject) => {
        const tx = selectorDb.transaction(ROUND_STORE, 'readwrite');
        const store = tx.objectStore(ROUND_STORE);
        const request = store.put({ key: 'currentState', remaining: remaining.slice() });
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function loadRoundState() {
      return new Promise((resolve, reject) => {
        const tx = selectorDb.transaction(ROUND_STORE, 'readonly');
        const store = tx.objectStore(ROUND_STORE);
        const request = store.get('currentState');
        request.onsuccess = () => resolve(request.result ? request.result.remaining : [1, 2, 3]);
        request.onerror = () => reject(request.error);
      });
    }

    function getAllSelections() {
      return new Promise((resolve, reject) => {
        const tx = selectorDb.transaction(SELECTION_STORE, 'readonly');
        const store = tx.objectStore(SELECTION_STORE);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    function renderRemaining() {
      const el = document.getElementById('remainingNumbers');
      if (!remaining.length) {
        el.innerHTML = '<span class="chip empty">No numbers left</span>';
        return;
      }
      el.innerHTML = remaining.map(n => `<span class="chip">${n}</span>`).join('');
    }

    function renderSelected() {
      const el = document.getElementById('selectedNumber');
      if (currentSelected === null) {
        el.textContent = '—';
        el.classList.remove('pulse');
        return;
      }
      el.textContent = currentSelected;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }

    function renderSelectorHistory(history) {
      const list = document.getElementById('selectorHistoryList');
      if (!history.length) {
        list.innerHTML = '<div class="empty-state">No selections yet.</div>';
        return;
      }

      list.innerHTML = history.slice().reverse().map(item => {
        const date = new Date(item.timestamp);
        const leftText = item.remainingAfter.length ? item.remainingAfter.join(', ') : 'None left';
        return `
          <div class="history-item">
            <div class="history-left">
              <span class="badge">${item.selected}</span>
              <div>
                <div>Selected: <strong>${item.selected}</strong></div>
                <div style="color: var(--muted); font-size: 0.8rem;">Left: ${leftText}</div>
              </div>
            </div>
            <div class="history-time">${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
          </div>
        `;
      }).join('');
    }

    function renderSelectorStats(history) {
      const counts = { 1: 0, 2: 0, 3: 0 };
      history.forEach(item => counts[item.selected]++);

      document.getElementById('totalSelections').textContent = history.length;
      document.getElementById('currentRound').textContent = remaining.length === 0 ? 0 : (3 - remaining.length);
      document.getElementById('leftCount').textContent = remaining.length;

      const ctx = document.getElementById('selectorChart').getContext('2d');
      const data = [counts[1], counts[2], counts[3]];
      if (selectorChart) {
        selectorChart.data.datasets[0].data = data;
        selectorChart.update();
      } else {
        selectorChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['1', '2', '3'],
            datasets: [{
              label: 'All-time selections',
              data,
              backgroundColor: ['#60a5fa', '#a78bfa', '#34d399'],
              borderRadius: 10
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
          }
        });
      }
    }

    async function refreshSelectorUI() {
      const history = await getAllSelections();
      renderRemaining();
      renderSelected();
      renderSelectorStats(history);
      renderSelectorHistory(history);
    }

    async function pickNumber() {
      if (remaining.length === 0) {
        currentSelected = null;
        renderSelected();
        alert('All numbers used. Reset the round to start again.');
        return;
      }

      const index = Math.floor(Math.random() * remaining.length);
      const chosen = remaining[index];
      currentSelected = chosen;

      const remainingAfter = remaining.filter(n => n !== chosen);
      remaining = remainingAfter;

      await saveSelection(chosen, remainingAfter);
      await saveRoundState();
      await refreshSelectorUI();
    }

    async function resetRound() {
      remaining = [1, 2, 3];
      currentSelected = null;
      await saveRoundState();
      await refreshSelectorUI();
    }

    // ===== COMMON =====
    function setMode(mode) {
      const randomSection = document.getElementById('randomSection');
      const selectorSection = document.getElementById('selectorSection');
      const randomBtn = document.querySelector('[data-mode="random"]');
      const selectorBtn = document.querySelector('[data-mode="select"]');

      const isRandom = mode === 'random';
      randomSection.style.display = isRandom ? 'block' : 'none';
      selectorSection.style.display = isRandom ? 'none' : 'block';
      randomBtn.classList.toggle('active', isRandom);
      selectorBtn.classList.toggle('active', !isRandom);
    }

    document.getElementById('generateBtn').addEventListener('click', generateNumber);
    document.getElementById('pickBtn').addEventListener('click', pickNumber);
    document.getElementById('resetRoundBtn').addEventListener('click', resetRound);
    document.getElementById('goRandom').addEventListener('click', () => setMode('random'));
    document.getElementById('goSelect').addEventListener('click', () => setMode('select'));
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    window.addEventListener('load', async () => {
      try {
        await initRandomDB();
        await initSelectorDB();
        const saved = await loadRoundState();
        remaining = saved || [1, 2, 3];
        await updateRandomUI();
        await refreshSelectorUI();
        setMode('random');
      } catch (error) {
        console.error(error);
        alert('IndexedDB is not available in this browser.');
      }
    });
  </script>
</body>
</html>
