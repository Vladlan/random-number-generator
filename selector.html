<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selection Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #0f172a;
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 10px;
      background: white;
      text-decoration: none;
      color: #0f172a;
      font-weight: 700;
    }
    .nav a.active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .display-box {
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #f0f9ff, #f5f3ff);
      border-radius: 12px;
      padding: 24px;
    }
    .display-label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .selections-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 12px 0;
      min-height: 100px;
      flex-wrap: wrap;
    }
    .selection-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .selection-label {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
    }
    .display-number {
      font-size: 3rem;
      font-weight: 900;
      color: #2563eb;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #dbeafe;
    }
    .display-number.pulse {
      animation: pulse 0.25s ease;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .arrow {
      font-size: 1.5rem;
      color: #64748b;
      font-weight: 700;
    }
    .remaining-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    .remaining-label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 12px;
      display: block;
    }
    .remaining-numbers {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 1.2rem;
    }
    .chip.empty {
      background: #f1f5f9;
      color: #94a3b8;
      width: auto;
      padding: 12px 14px;
    }
    .btn {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 1rem;
      transition: transform 0.15s ease;
      margin-top: 20px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }
    .btn-secondary {
      background: white;
      border: 1px solid #e2e8f0;
      color: #0f172a;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-value {
      display: block;
      font-size: 2rem;
      font-weight: 800;
      color: #3b82f6;
    }
    .stat-label {
      display: block;
      margin-top: 6px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
    }
    .chart-wrap { height: 220px; }
    .history-box {
      max-height: 280px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .history-item:last-child { border-bottom: none; }
    .history-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .history-text {
      text-align: left;
    }
    .history-selected {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .history-left {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .time {
      color: #64748b;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 26px 16px;
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
      .selections-row { gap: 12px; }
      .display-number { width: 60px; height: 60px; font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎲 Selection Analyzer</h1>
      <nav class="nav">
        <a href="index.html">Combined</a>
        <a href="random.html">Random Only</a>
        <a href="selector.html" class="active">Selection Only</a>
      </nav>
    </header>

    <div class="grid">
      <div class="card">
        <div class="display-box">
          <div class="display-label">Selection Process</div>

          <div class="selections-row">
            <div class="selection-item">
              <span class="selection-label">First Pick</span>
              <div class="display-number" id="firstNumber">-</div>
            </div>
            <span class="arrow">→</span>
            <div class="selection-item">
              <span class="selection-label">Second Pick</span>
              <div class="display-number" id="secondNumber">-</div>
            </div>
            <span class="arrow">→</span>
            <div class="selection-item">
              <span class="selection-label">Left Behind</span>
              <div class="display-number" id="leftNumber">-</div>
            </div>
          </div>

          <div class="remaining-box">
            <span class="remaining-label">Available for next round</span>
            <div class="remaining-numbers" id="remainingNumbers"></div>
          </div>

          <button class="btn btn-primary" id="pickBtn">Run Selection</button>
        </div>
      </div>

      <div class="card">
        <h2>Count Digits Left Behind</h2>
        <div class="stats-grid" id="leftBehindStats">
          <div class="stat-card">
            <span class="stat-value" id="count1">0</span>
            <span class="stat-label">Digit 1</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="count2">0</span>
            <span class="stat-label">Digit 2</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="count3">0</span>
            <span class="stat-label">Digit 3</span>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="leftChart"></canvas></div>
      </div>
    </div>

    <div class="card">
      <h2>Round History</h2>
      <div class="history-box" id="historyList">
        <div class="empty-state">No rounds yet. Click "Run Selection" to start!</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="resetAll()">New Analysis</button>
      </div>
    </div>
  </div>

  <script>
    const DB_NAME = 'SelectionAnalyzerDB';
    const STORE = 'rounds';
    let db;
    let chart;
    let isRunning = false;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE)) {
            database.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          db = request.result;
          resolve();
        };
        request.onerror = () => reject(request.error);
      });
    }

    function addRound(first, second, left) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE], 'readwrite');
        const store = tx.objectStore(STORE);
        const record = { first, second, left, timestamp: new Date().toISOString() };
        const req = store.add(record);
        req.onsuccess = () => resolve(record);
        req.onerror = () => reject(req.error);
      });
    }

    function getAllRounds() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE], 'readonly');
        const store = tx.objectStore(STORE);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function clearAllRounds() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE], 'readwrite');
        const store = tx.objectStore(STORE);
        const req = store.clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function runSelection() {
      if (isRunning) return;
      isRunning = true;

      const numbers = [1, 2, 3];

      const firstIdx = Math.floor(Math.random() * 3);
      const first = numbers[firstIdx];

      const remaining = numbers.filter(n => n !== first);
      const secondIdx = Math.floor(Math.random() * 2);
      const second = remaining[secondIdx];

      const left = remaining.filter(n => n !== second)[0];

      displayNumbers(first, second, left);
      await addRound(first, second, left);
      await updateUI();

      setTimeout(() => {
        isRunning = false;
      }, 500);
    }

    function displayNumbers(first, second, left) {
      const firstEl = document.getElementById('firstNumber');
      const secondEl = document.getElementById('secondNumber');
      const leftEl = document.getElementById('leftNumber');

      firstEl.textContent = first;
      firstEl.classList.add('pulse');
      setTimeout(() => {
        secondEl.textContent = second;
        secondEl.classList.add('pulse');
      }, 150);

      setTimeout(() => {
        leftEl.textContent = left;
        leftEl.classList.add('pulse');
      }, 300);

      setTimeout(() => {
        firstEl.classList.remove('pulse');
        secondEl.classList.remove('pulse');
        leftEl.classList.remove('pulse');
      }, 500);
    }

    function renderHistory(rounds) {
      const list = document.getElementById('historyList');
      if (!rounds.length) {
        list.innerHTML = '<div class="empty-state">No rounds yet. Click "Run Selection" to start!</div>';
        return;
      }

      list.innerHTML = rounds.slice().reverse().map(r => {
        const t = new Date(r.timestamp);
        return `
          <div class="history-item">
            <div class="history-content">
              <span class="badge">${r.first}</span>
              <span class="badge" style="background: #fce7f3; color: #be185d;">${r.second}</span>
              <span class="badge" style="background: #d1d5db; color: #374151;">${r.left}</span>
              <div class="history-text">
                <div class="history-selected">Picked: ${r.first} → ${r.second}</div>
                <div class="history-left">Left behind: ${r.left}</div>
              </div>
            </div>
            <span class="time">${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
        `;
      }).join('');
    }

    function renderStats(rounds) {
      const leftCounts = { 1: 0, 2: 0, 3: 0 };
      rounds.forEach(r => leftCounts[r.left]++);

      // Update count values
      document.getElementById('count1').textContent = leftCounts[1];
      document.getElementById('count2').textContent = leftCounts[2];
      document.getElementById('count3').textContent = leftCounts[3];

      const ctx = document.getElementById('leftChart');
      if (!ctx) return;

      const data = [leftCounts[1], leftCounts[2], leftCounts[3]];
      if (chart) {
        chart.data.datasets[0].data = data;
        chart.update();
      } else {
        chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Digit 1', 'Digit 2', 'Digit 3'],
            datasets: [{
              label: 'Times Left Behind',
              data,
              backgroundColor: ['#60a5fa', '#a78bfa', '#ec4899'],
              borderRadius: 8,
              borderSkipped: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }
    }

    function renderRemaining() {
      const el = document.getElementById('remainingNumbers');
      el.innerHTML = '<span class="chip">1</span><span class="chip">2</span><span class="chip">3</span>';
    }

    async function updateUI() {
      const rounds = await getAllRounds();
      renderHistory(rounds);
      renderStats(rounds);
      renderRemaining();
    }

    async function resetAll() {
      if (!confirm('Clear all round history?')) return;
      await clearAllRounds();
      document.getElementById('firstNumber').textContent = '-';
      document.getElementById('secondNumber').textContent = '-';
      document.getElementById('leftNumber').textContent = '-';
      await updateUI();
    }

    document.getElementById('pickBtn').addEventListener('click', runSelection);

    window.addEventListener('load', async () => {
      try {
        await initDB();
        await updateUI();
      } catch (error) {
        console.error(error);
        alert('IndexedDB not supported in this browser.');
      }
    });
  </script>
</body>
</html>
